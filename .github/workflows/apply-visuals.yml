name: Apply JPN visual stylesheet

on:
  push:
    branches: [main, visual-review-assets]

permissions:
  contents: write

jobs:
  apply-visuals:
    if: ${{ !contains(github.event.head_commit.message, '[visuals-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach visual stylesheet
        run: |
          grep -q 'assets/visuals/visuals.css' styles.css || printf '\n@import url("assets/visuals/visuals.css");\n' >> styles.css
      - name: Commit visual stylesheet
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply visual assets [visuals-applied]'
          git push
